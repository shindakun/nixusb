# Noctalia v5 config, Arch side only.
#   Copied to ~/.config/noctalia/config.toml by arch/install/dotfiles.sh.
#
# This is NOT shared with the NixOS side. The Air runs Noctalia v4 (the
# Quickshell build), which is a separate install with a different config
# format; Arch packages only v5. If the Air is ever moved to v5, this file can
# move back to nix/home/ and be shared like the niri config.
#
# This is the base layer. Changes made in Noctalia's settings UI are saved to
# ~/.local/state/noctalia/settings.toml and win over this file, so the file
# can stay read-only (it is a /nix/store symlink on NixOS). Every key not set
# here keeps Noctalia's default.

[shell]
font_family        = "FiraCode Nerd Font"
telemetry_enabled  = false
polkit_agent       = true
settings_show_advanced = false

[theme]
mode    = "dark"
source  = "builtin"
builtin = "Catppuccin"

[wallpaper]
enabled   = true

[backdrop]
enabled = true

[lockscreen]
enabled = true

[idle.behavior.lock]
timeout = 600
action  = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 660
action  = "screen_off"
enabled = true

[bar.main]
position = "top"
start  = ["launcher", "workspaces"]
center = ["clock"]
end    = ["media", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]
